<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RemoveBG Fast - AI Background Remover</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between items-center p-4 font-['Plus_Jakarta_Sans']">

  <!-- Cute & Premium Header -->
  <header class="w-full max-w-lg text-center pt-8 pb-4">
    <div class="inline-flex items-center space-x-2 bg-black text-white text-[10px] tracking-widest font-extrabold px-3 py-1 rounded-full uppercase mb-3 shadow-sm">
      <span>⚡ 100% Free & Private</span>
    </div>
    <h1 class="text-4xl font-extrabold tracking-tight text-gray-950">Remove Background</h1>
    <p class="text-xs text-gray-500 font-medium mt-1">Instant Client-Side AI • No Quality Loss</p>
  </header>

  <!-- Main Card Component -->
  <main class="w-full max-w-lg bg-white rounded-3xl border border-gray-100 p-6 sm:p-8 shadow-xl shadow-gray-200/50 space-y-6">
    
    <!-- Upload Dropzone Zone -->
    <div id="upload-zone" class="border-2 border-dashed border-gray-200 rounded-2xl p-8 text-center hover:border-black transition-all cursor-pointer group bg-gray-50/50 hover:bg-white">
      <div class="w-16 h-16 bg-white border border-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm group-hover:scale-110 transition-transform">
        <svg class="w-7 h-7 text-gray-800" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
      </div>
      <h3 class="text-base font-bold text-gray-800">Upload your image</h3>
      <p class="text-xs text-gray-400 mt-1 mb-6">PNG, JPG, WEBP up to 10MB</p>

      <input type="file" id="image-input" accept="image/*" class="hidden">
      <button onclick="document.getElementById('image-input').click()" class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3.5 px-6 rounded-xl transition active:scale-95 shadow-md shadow-black/10">
        Choose File
      </button>
    </div>

    <!-- Sexy Refill Loader & Status -->
    <div id="status" class="hidden py-10 text-center space-y-5">
      <div class="relative w-20 h-20 mx-auto">
        <!-- Outer Spin Ring -->
        <div class="absolute inset-0 rounded-full border-4 border-gray-100 border-t-black animate-spin"></div>
        <!-- Inner Center Pulse -->
        <div class="absolute inset-2 bg-gray-50 rounded-full flex items-center justify-center">
          <span class="text-xs font-extrabold text-black" id="progress-percent">0%</span>
        </div>
      </div>
      
      <div class="space-y-1">
        <p id="status-text" class="text-sm font-bold text-gray-900">Initializing AI Model...</p>
        <p class="text-xs text-gray-400">Processing locally inside your browser</p>
      </div>

      <!-- Animated Progress Refill Bar -->
      <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
        <div id="progress-bar" class="bg-black h-full w-0 transition-all duration-300 rounded-full"></div>
      </div>
    </div>

    <!-- Result Display & Transparent Grid -->
    <div id="result-container" class="hidden space-y-5">
      <div class="relative w-full aspect-square bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:12px_12px] bg-gray-50 rounded-2xl flex items-center justify-center p-4 border border-gray-100 overflow-hidden">
        <img id="result-img" class="max-h-full max-w-full object-contain drop-shadow-md" alt="Result Image">
      </div>

      <div class="space-y-2">
        <a id="download-btn" download="removebg-fast.png" class="block w-full bg-black hover:bg-gray-800 text-white font-semibold py-3.5 rounded-xl text-center transition active:scale-95 shadow-md shadow-black/10">
          Download HD Result
        </a>
        <button id="reset-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl text-xs transition">
          Remove Another Image
        </button>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-lg text-center py-6">
    <p class="text-xs text-gray-400 font-medium">Built with AI • Zero Data Uploaded</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
